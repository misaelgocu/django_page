{% extends 'base.html' %}
{% load static %}
{% block title %}Conexión | DJANGO_DEV{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="glass-card">
        <div class="card-header-cyber">
            <h2 class="text-break">ESTABLECER_CONEXIÓN</h2>
            <div class="pulse-line"></div>
        </div>
        <p class="text-secondary text-center small mb-4">Transmitiendo datos al servidor central...</p>
        
        <form class="cyber-form">
            <div class="form-group-cyber">
                <label><i class="fas fa-user-secret"></i> Identificación</label>
                <input type="text" placeholder="Ej: Neo" required>
            </div>
            <div class="form-group-cyber">
                <label><i class="fas fa-satellite-dish"></i> Canal (Email)</label>
                <input type="email" placeholder="nombre@dominio.com" required>
            </div>
            <div class="form-group-cyber">
                <label><i class="fas fa-terminal"></i> Mensaje</label>
                <textarea rows="4" placeholder="Escribe tu comando aquí..."></textarea>
            </div>
            <button type="submit" class="cta-button w-100 mt-3">
                <span class="btn-text">Transmitir Datos</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
